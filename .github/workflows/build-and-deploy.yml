name: Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*'    # Match version tags
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os.pretty }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      matrix:
        os:
          - name: darwin
            runs-on: [macos-latest]
            pretty: 🍎 macOS
          - name: linux
            runs-on: [ubuntu-latest]
            pretty: 🐧 Linux
          - name: windows
            runs-on: [windows-latest]
            pretty: 🪟 Windows
            output: bettercap.exe
        arch: [amd64, arm64]
        go: [1.25.x]
        exclude:
          - os:
              name: darwin
            arch: amd64
          # Linux ARM64 images are not yet publicly available (https://github.com/actions/runner-images)
          - os:
              name: linux
            arch: arm64
          - os:
              name: windows
            arch: arm64

    env:
      OUTPUT: ${{ matrix.os.output || 'bettercap' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Install Dependencies (Linux)
      if: ${{ matrix.os.name == 'linux' }}
      run: sudo apt-get update && sudo apt-get install -y p7zip-full libpcap-dev libnetfilter-queue-dev libusb-1.0-0-dev

    - name: Install Dependencies (macOS)
      if: ${{ matrix.os.name == 'darwin' }}
      run: brew install libpcap libusb p7zip

    - name: Install MinGW x64 dependencies (Windows)
      if: ${{ matrix.os.name == 'windows' }}
      uses: msys2/setup-msys2@v2
      with:
        install: |-
          mingw64/mingw-w64-x86_64-gcc
          mingw64/mingw-w64-x86_64-libusb
          mingw64/mingw-w64-x86_64-pkg-config

    - name: Install build dependencies (Windows)
      if: ${{ matrix.os.name == 'windows' }}
      shell: pwsh
      run: |
        choco install make -y --no-progress
        choco install 7zip -y --no-progress

        curl.exe -L "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip" -o "$env:RUNNER_TEMP\wpcap-sdk.zip"
        7z x -y "$env:RUNNER_TEMP\wpcap-sdk.zip" "-oC:\winpcap"

        "$env:RUNNER_TEMP\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CGO_CFLAGS=-IC:/winpcap/WpdPack/Include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CGO_LDFLAGS=-LC:/winpcap/WpdPack/Lib/x64 -lwpcap" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build
      run: make -e TARGET="${{ env.OUTPUT }}"

    - name: Verify and package build (Linux/macOS)
      if: ${{ matrix.os.name != 'windows' }}
      run: |
        file "${{ env.OUTPUT }}"
        openssl dgst -sha256 "${{ env.OUTPUT }}" | tee bettercap_${{ matrix.os.name }}_${{ matrix.arch }}.sha256
        7z a "bettercap_${{ matrix.os.name }}_${{ matrix.arch }}.zip" "${{ env.OUTPUT }}" "bettercap_${{ matrix.os.name }}_${{ matrix.arch }}.sha256"

    - name: Bundle runtime dependencies and package build (Windows)
      if: ${{ matrix.os.name == 'windows' }}
      shell: pwsh
      run: |
        if (-not (Test-Path "${{ env.OUTPUT }}")) {
          throw "${{ env.OUTPUT }} was not produced"
        }

        $mingwBin = Join-Path $env:RUNNER_TEMP "msys64\mingw64\bin"
        $objdump = Join-Path $mingwBin "objdump.exe"
        $dist = Join-Path $PWD "dist"

        if (-not (Test-Path $objdump)) {
          throw "MinGW objdump.exe was not found at $objdump"
        }

        New-Item -ItemType Directory -Force -Path $dist | Out-Null
        Copy-Item "${{ env.OUTPUT }}" (Join-Path $dist "bettercap.exe") -Force

        # Recursively bundle MinGW/MSYS2-provided DLLs required by the EXE and by
        # other bundled DLLs. Windows system DLLs and WinPcap/Npcap are not copied.
        $queue = [System.Collections.Generic.Queue[string]]::new()
        $queue.Enqueue((Join-Path $dist "bettercap.exe"))
        $seen = @{}

        while ($queue.Count -gt 0) {
          $binary = $queue.Dequeue()
          $dependencies = & $objdump -p $binary 2>$null |
            Select-String "DLL Name:" |
            ForEach-Object { ($_ -replace '^.*DLL Name:\s*', '').Trim() }

          foreach ($dll in $dependencies) {
            $key = $dll.ToLowerInvariant()
            if ($seen.ContainsKey($key)) {
              continue
            }
            $seen[$key] = $true

            $source = Join-Path $mingwBin $dll
            if (Test-Path $source) {
              $target = Join-Path $dist $dll
              Copy-Item $source $target -Force
              $queue.Enqueue($target)
              Write-Host "Bundled runtime dependency: $dll"
            }
          }
        }

        $libusb = Join-Path $dist "libusb-1.0.dll"
        if (-not (Test-Path $libusb)) {
          throw "libusb-1.0.dll was not bundled; refusing to publish a broken Windows artifact"
        }

        $checksumFile = "bettercap_windows_amd64.sha256"
        $checksums = Get-ChildItem $dist -File | Sort-Object Name | ForEach-Object {
          $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($_.Name)"
        }
        $checksums | Set-Content -Path $checksumFile -Encoding ascii
        Copy-Item $checksumFile (Join-Path $dist "SHA256SUMS.txt") -Force

        Compress-Archive -Path (Join-Path $dist "*") -DestinationPath "bettercap_windows_amd64.zip" -Force

        Write-Host "Packaged Windows files:"
        Get-ChildItem $dist -File | Sort-Object Name | Format-Table Name, Length
        Get-Content $checksumFile

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-artifacts-${{ matrix.os.name }}-${{ matrix.arch }}
        path: |
          bettercap_*.zip
          bettercap_*.sha256
        if-no-files-found: error

  deploy:
    needs: [build]
    name: Release
    runs-on: ubuntu-latest
    steps:
        - name: Download Artifacts
          uses: actions/download-artifact@v8
          with:
            pattern: release-artifacts-*
            merge-multiple: true
            path: dist/

        - name: Release Assets
          run: ls -l dist

        - name: Upload Release Assets
          uses: softprops/action-gh-release@v3
          if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
          with:
            files: dist/bettercap_*
    env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
