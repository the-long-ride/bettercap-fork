name: Manual Windows x64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    name: Windows x64 (Intel/AMD)
    runs-on: windows-latest

    env:
      GO111MODULE: "on"
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "1"
      CGO_CFLAGS: -IC:/winpcap/WpdPack/Include
      CGO_LDFLAGS: -LC:/winpcap/WpdPack/Lib/x64 -lwpcap

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Install MinGW x64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          install: |-
            mingw64/mingw-w64-x86_64-gcc
            mingw64/mingw-w64-x86_64-libusb
            mingw64/mingw-w64-x86_64-pkg-config

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          choco install make -y --no-progress
          choco install 7zip -y --no-progress

          curl.exe -L "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip" -o "$env:RUNNER_TEMP\wpcap-sdk.zip"
          7z x -y "$env:RUNNER_TEMP\wpcap-sdk.zip" "-oC:\winpcap"

          "$env:RUNNER_TEMP\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify x64 toolchain
        shell: pwsh
        run: |
          go version
          gcc --version
          pkg-config --modversion libusb-1.0
          Write-Host "GOOS=$env:GOOS GOARCH=$env:GOARCH CGO_ENABLED=$env:CGO_ENABLED"

      - name: Build bettercap.exe
        shell: pwsh
        run: make -e TARGET="bettercap.exe"

      - name: Bundle runtime dependencies and package artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "bettercap.exe")) {
            throw "bettercap.exe was not produced"
          }

          $mingwBin = Join-Path $env:RUNNER_TEMP "msys64\mingw64\bin"
          $objdump = Join-Path $mingwBin "objdump.exe"
          $dist = Join-Path $PWD "dist"

          if (-not (Test-Path $objdump)) {
            throw "MinGW objdump.exe was not found at $objdump"
          }

          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "bettercap.exe" (Join-Path $dist "bettercap.exe") -Force

          # Recursively bundle DLLs supplied by the MinGW/MSYS2 toolchain.
          # Windows system DLLs and WinPcap/Npcap DLLs are intentionally not copied.
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue((Join-Path $dist "bettercap.exe"))
          $seen = @{}

          while ($queue.Count -gt 0) {
            $binary = $queue.Dequeue()
            $dependencies = & $objdump -p $binary 2>$null |
              Select-String "DLL Name:" |
              ForEach-Object { ($_ -replace '^.*DLL Name:\s*', '').Trim() }

            foreach ($dll in $dependencies) {
              $key = $dll.ToLowerInvariant()
              if ($seen.ContainsKey($key)) {
                continue
              }
              $seen[$key] = $true

              $source = Join-Path $mingwBin $dll
              if (Test-Path $source) {
                $target = Join-Path $dist $dll
                Copy-Item $source $target -Force
                $queue.Enqueue($target)
                Write-Host "Bundled runtime dependency: $dll"
              }
            }
          }

          $libusb = Join-Path $dist "libusb-1.0.dll"
          if (-not (Test-Path $libusb)) {
            throw "libusb-1.0.dll was not bundled; the generated executable would fail on a clean Windows machine"
          }

          Write-Host "Packaged files:"
          Get-ChildItem $dist -File | Sort-Object Name | Format-Table Name, Length

          $checksums = Get-ChildItem $dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path "bettercap_windows_amd64.sha256" -Encoding ascii
          Copy-Item "bettercap_windows_amd64.sha256" (Join-Path $dist "SHA256SUMS.txt") -Force

          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath "bettercap_windows_amd64.zip" -Force

          Write-Host "Runtime dependencies of bettercap.exe:"
          & $objdump -p (Join-Path $dist "bettercap.exe") |
            Select-String "DLL Name:"
          Get-Content "bettercap_windows_amd64.sha256"

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: bettercap-windows-amd64-${{ github.run_number }}
          path: |
            bettercap_windows_amd64.zip
            bettercap_windows_amd64.sha256
          if-no-files-found: error
